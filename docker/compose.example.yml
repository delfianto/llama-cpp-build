services:
  llama-server:
    image: ghcr.io/delfianto/llama.cpp:cuda
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /mnt/sata1/models:/models:ro
    environment:
      MODEL_PATH: /models/model.gguf
      # MMPROJ_PATH: /models/mmproj.gguf
      CTX_SIZE: "8192"
      THREADS: "16"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
